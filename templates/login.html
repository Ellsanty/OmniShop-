<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OmniShop | Iniciar sesión</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="auth-page">
  <section class="auth-box">
    <a class="logo" href="{{ url_for('index') }}">OmniShop<b>▮</b></a>
    <h1>Iniciar sesión</h1>
    {% if error %}<div class="notice error-notice">{{ error }}</div>{% endif %}
    <form method="post" class="auth-form">
      <input type="hidden" name="next" value="{{ next_url }}">
      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" required autocomplete="email">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">
      <button class="checkout" type="submit">Entrar</button>
    </form>
    <p class="auth-switch">¿No tienes cuenta? <a href="{{ url_for('registro', next=next_url) }}">Crear cuenta</a></p>
  </section>
</main>
</body>
</html>
