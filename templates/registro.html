<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OmniShop | Crear cuenta</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="auth-page">
  <section class="auth-box">
    <a class="logo" href="{{ url_for('index') }}">OmniShop<b>▮</b></a>
    <h1>Crear cuenta</h1>
    {% if error %}<div class="notice error-notice">{{ error }}</div>{% endif %}
    <form method="post" class="auth-form">
      <input type="hidden" name="next" value="{{ next_url }}">
      <label for="nombre">Nombre</label>
      <input id="nombre" name="nombre" required autocomplete="given-name">
      <label for="apellido">Apellido</label>
      <input id="apellido" name="apellido" required autocomplete="family-name">
      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" required autocomplete="email">
      <label for="telefono">Teléfono</label>
      <input id="telefono" name="telefono" type="tel" autocomplete="tel">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" minlength="6" required autocomplete="new-password">
      <button class="checkout" type="submit">Registrarme</button>
    </form>
    <p class="auth-switch">¿Ya tienes cuenta? <a href="{{ url_for('login', next=next_url) }}">Iniciar sesión</a></p>
  </section>
</main>
</body>
</html>
